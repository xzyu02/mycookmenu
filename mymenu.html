:root {
  color-scheme: light;
  --bg: #faf7f2; --surface: #ffffff; --surface-2: #f3eee6; --text: #1f1b16; --muted: #6f675e;
  --border: #ebe4da; --accent: #d9480f; --accent-text: #ffffff; --soft: #fff0e6;
  --shadow: 0 1px 2px rgba(31, 27, 22, .05), 0 6px 20px rgba(31, 27, 22, .06);
  --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #15120f; --surface: #211d18; --surface-2: #2a251f; --text: #f2ede6; --muted: #a79e93;
    --border: #353029; --accent: #ff8a4c; --accent-text: #1a0f08; --soft: #33241a; --shadow: none;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); padding-bottom: 96px; }
body:has(dialog[open]) { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
input, textarea { font-size: 16px; }  /* iPhone Safari 会在字号小于16px的输入框获得焦点时自动放大页面 */
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

.hero { background: linear-gradient(180deg, var(--soft), transparent); }
.hero-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding-top: 20px; padding-bottom: 12px; }
.logo { display: block; height: 64px; width: auto; }
.brand { margin: 0; font-family: 'BrandFont', var(--font); font-size: 32px; font-weight: 600; line-height: 1.1; }
.tagline { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
#random { margin-left: auto; }

.btn { border: 1px solid transparent; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--accent-text); }
.btn-soft { background: var(--soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.btn-ghost { background: transparent; border-color: var(--border); }

.toolbar {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.search-row { display: flex; gap: 8px; padding: 10px 0; }
#search {
  flex: 1; min-width: 0; height: 40px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface);
}
.toggle { height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); white-space: nowrap; }
.toggle[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
/* 左侧分类栏 + 右侧菜品列表 */
.layout { display: flex; align-items: flex-start; gap: 20px; }
.rail {
  position: sticky; top: var(--toolbar-h, 60px); flex: none; width: 168px;
  max-height: calc(100vh - var(--toolbar-h, 60px)); max-height: calc(100dvh - var(--toolbar-h, 60px));
  overflow-y: auto; overscroll-behavior: contain; padding: 16px 0 96px; scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.chip {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%;
  padding: 10px 12px; border: 0; border-radius: 12px; background: none; text-align: left; overflow-wrap: anywhere;
}
.chip-count { flex: none; color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: var(--shadow); }
.chip[aria-pressed="true"] .chip-count { color: inherit; opacity: .7; }
.chip-empty:not([aria-pressed="true"]) { opacity: .45; }
.content { flex: 1; min-width: 0; }

.cat { padding-top: 20px; scroll-margin-top: calc(var(--toolbar-h, 60px) + 8px); }
.cat-title { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; font-size: 20px; }
.cat-count { color: var(--muted); font-size: 13px; font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card {
  display: flex; gap: 12px; padding: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
}
.card-body { display: flex; flex: 1; flex-direction: column; gap: 8px; min-width: 0; }
.card > .qty-slot { align-self: flex-end; }
.card-main { display: block; padding: 0; border: 0; background: none; text-align: left; }
.dish-name { display: block; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.card-main:hover .dish-name { color: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 12px; }
.tag-todo { background: var(--soft); color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.link-chip {
  padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text);
  font-size: 13px; text-decoration: none; white-space: nowrap;
}
.link-chip:hover { background: var(--soft); color: var(--accent); }

.qty-slot { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.add-btn, .step {
  display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border-radius: 50%;
  font-size: 20px; line-height: 1;
}
.add-btn { border: 0; background: var(--accent); color: var(--accent-text); }
.step { border: 1.5px solid var(--accent); background: transparent; color: var(--accent); }
.qty-n { min-width: 1.5em; text-align: center; font-weight: 700; }
.qty-slot.big .add-btn { width: auto; height: 44px; padding: 0 22px; border-radius: 999px; font-size: 16px; font-weight: 600; }
.qty-slot.big .step { width: 40px; height: 40px; }

.empty { padding: 48px 16px; color: var(--muted); text-align: center; }
.footer { padding-top: 40px; color: var(--muted); font-size: 13px; text-align: center; }
.footer-cat { display: block; height: 96px; width: auto; margin: 0 auto 8px; }

.cartbar {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 6; transform: translateX(-50%);
  width: min(560px, calc(100% - 32px));
}
.cartbar-btn {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px 10px 16px; border: 0; border-radius: 999px;
  background: var(--text); color: var(--bg); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); text-align: left;
}
.cart-icon { position: relative; font-size: 22px; }
#cart-badge {
  position: absolute; top: -6px; right: -10px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px;
  background: var(--accent); color: var(--accent-text); font-size: 12px; font-weight: 700; line-height: 20px; text-align: center;
}
#cart-summary { flex: 1; font-weight: 600; }
.cartbar-cta { padding: 8px 16px; border-radius: 999px; background: var(--accent); color: var(--accent-text); font-weight: 600; }

dialog.sheet {
  width: min(560px, calc(100% - 32px)); max-width: none; padding: 0; border: 0; border-radius: 20px;
  background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
}
dialog.sheet::backdrop { background: rgba(20, 16, 12, .45); }
.sheet-inner { display: flex; flex-direction: column; max-height: min(85vh, 760px); outline: none; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; }
.sheet-head h2 { margin: 0; font-size: 20px; overflow-wrap: anywhere; }
.eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 13px; }
.icon-btn {
  flex: none; width: 34px; height: 34px; margin-left: auto; border: 0; border-radius: 50%;
  background: var(--surface-2); color: var(--muted); font-size: 15px;
}
.sheet-body { flex: 1; overflow: auto; padding: 0 20px 16px; }
.sheet-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
.dish-links { margin-bottom: 12px; }
.recipe { margin: 0; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); white-space: pre-line; overflow-wrap: anywhere; line-height: 1.7; }
.recipe.muted { color: var(--muted); }
.cart-list { margin: 0; padding: 0; list-style: none; }
.cart-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.cart-item-name { font-weight: 600; overflow-wrap: anywhere; }
.cart-item-cat { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.cart-empty { padding: 16px 0 24px; color: var(--muted); text-align: center; }
.empty-cat { display: block; width: 180px; max-width: 60%; height: auto; margin: 0 auto 8px; }
.note-label { display: block; margin: 16px 0 6px; color: var(--muted); font-size: 13px; }
#cart-note { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); resize: vertical; }
.cart-actions .btn-primary { margin-left: auto; }
.btn:disabled, .step:disabled { opacity: .4; cursor: default; }
.meal-count { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.meal-count-label { font-weight: 600; }
.meal-result { margin-top: 8px; }
.meal-item { display: flex; flex: 1; flex-direction: column; gap: 6px; min-width: 0; }
.meal-top { display: flex; align-items: center; gap: 8px; }
.meal-name { padding: 0; border: 0; background: none; font-weight: 600; text-align: left; overflow-wrap: anywhere; }
.meal-name:hover { color: var(--accent); }
.meal-result .icon-btn, .meal-result .qty-slot { margin-left: 0; }
.meal-actions .btn-primary { margin-left: auto; }

.toast {
  position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 20; transform: translate(-50%, 8px);
  max-width: calc(100% - 32px); padding: 8px 16px; border-radius: 999px; background: var(--text); color: var(--bg);
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 600px) {
  .logo { height: 48px; }
  .brand { font-size: 26px; }
  #random { margin-left: 0; }
  /* 手机：分类栏贴左边，每道菜一行 */
  .layout.wrap { gap: 0; padding-left: 0; }
  .rail { width: 84px; padding: 0 0 96px; background: var(--surface-2); }
  .chip { flex-direction: column; justify-content: center; gap: 2px; padding: 14px 6px; border-radius: 0; font-size: 14px; text-align: center; }
  .chip[aria-pressed="true"] { background: var(--bg); box-shadow: none; }
  .chip[aria-pressed="true"]::before {
    content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
  }
  .content { padding-left: 12px; }
  .cat { padding-top: 12px; }
  .cat-title { margin-bottom: 0; font-size: 16px; }
  .grid { display: block; }
  .card { align-items: center; padding: 12px 0; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: none; box-shadow: none; }
  .card:last-child { border-bottom: 0; }
  .card > .qty-slot { align-self: center; }
  .card-body { gap: 6px; }
  dialog.sheet { width: 100%; margin: auto 0 0; border-radius: 20px 20px 0 0; }
  .sheet-inner { max-height: 88vh; }
}
@media print { .toolbar, .rail, .cartbar, #random, .qty-slot { display: none !important; } body { padding-bottom: 0; } }
</style>
</head>

alse, "recipe": "", "links": [], "videoText": ""}, {"name": "豉油鸡", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "1. 半只鸡洗净，沥干水。准备葱结 姜蒜 一小块片糖。\n2. 碗里加半碗酱油，一勺老抽 一勺高度白酒（或者玫瑰露酒），备用。\n3. 锅烧油，把鸡下锅煎至金黄，加葱姜蒜爆香，倒入酱汁煮沸，加片糖和一碗开水，煮开后转中小火20分钟。\n4. 期间每隔5分钟翻一次面，最后大火收汁，用勺子不断的把锅里的汤汁淋在鸡皮上，直至颜色红亮即可。\n5. 最后把鸡放凉，斩块，淋上剩下的汤汁就搞定了。", "links": [], "videoText": ""}, {"name": "烤鸡加工", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "烤鸡怎么吃：\n1. 鸡丝凉面拌面\n2. 空气炸锅烤一烤+孜然辣椒面\n3. 椒麻鸡", "links": [], "videoText": ""}, {"name": "烤鸡胸", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "大碗1000克水、50克盐、任何喜欢的香草（罗勒、迷迭香之类..不放也可以）混合均匀后放入鸡胸，封保鲜膜放冰箱超过六个小时。烤箱预热150度，鸡胸捞出后冲洗干净盐水后放入烤盘（不用擦干水分），表面撒上红糖，烤箱中层烤38分钟，拿出后室温冷却之后再切片。放冰箱密封保存可以3-4天。\n\n这样烤出来的鸡胸会嫩很多，不用低温料理棒也可以。做色拉做三明治都合适，是控制体重的好朋友！", "links": [], "videoText": ""}, {"name": "豆豉干煎鸡", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "鸡腿肉先腌制（蚝油生抽盐胡椒+玉米淀粉+油），辣椒先干炒拿出来，然后煎鸡肉，煎金黄+豆豉+辣椒+红葱头+蒜瓣，+料酒闷一段时间", "links": [], "videoText": ""}, {"name": "柠檬干煎鸡", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "🌟食材准备：\n新鲜的鸡腿肉、洋葱、香菜、柠檬、蒜、白砂糖、老抽、生抽、淀粉、耗油\n💪做法步骤：\n1.将鸡肉洗净切块，放入碗中🥣。加入老抽、生抽、耗油、淀粉，抓匀腌制一段时间🕙。\n2.热锅凉油，将鸡肉块放入锅中，小火慢煎🥘。煎至两面金黄，表皮酥脆。\n3.加入切好的蒜片和洋葱炒香。再加入半勺白糖、小米辣、柠檬，翻炒均匀\n4.盖上锅盖焖煮三分钟，最后可以根据个人喜好撒上一些葱花或者香菜点缀一下，就可以出锅啦", "links": [], "videoText": ""}, {"name": "葱姜鸡腿饭", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "剁椒鸡胗", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "酸豆角鸡胗", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "干煸鸡胗", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "酱油手撕鸡", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [["小红书", "https://xhslink.com/m/8oVHoMEDyPk"]], "videoText": ""}, {"name": "山东炒鸡", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "椰子鸡汤", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "炸鸡排", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "钵钵鸡", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "冬瓜桑拿鸡", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "豉汁凤爪", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "1. 先焯水 剪指甲 然后加一点点老抽摇匀 400 F 35分钟 泡到热水里面出虎皮\n2. 酱汁，金银蒜，先炒金黄蒜末，再加生蒜，然后加黄豆酱，柱侯酱，桂林辣椒酱，蚝油。\n3.鸡爪拿生粉抓一下，然后加酱，适量加蚝油生抽盐糖都一点点\n4. 可以高压锅压一下，更入味\n5. 蒸\n\nor\n\n4 5一起搞，直接腌完之后丢进高压锅压，10分钟，加一丢丢水防止糊底就好", "links": [["视频", "https://xhslink.cn/o/Aw0Ds3BAkJB"]], "videoText": ""}, {"name": "香炸掌中宝", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "陈醋鸡脚", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/1RK1z84W235"]], "videoText": ""}, {"name": "笨萝卜醋蒸鸡", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/3TnA2jSdVgp"]], "videoText": ""}, {"name": "脆皮嫩肉烤鸡", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/13AJLwTFf9o"]], "videoText": ""}, {"name": "鲜熘鸡丝", "cat": "鸡🐔", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/V5133X64d7"]], "videoText": ""}, {"name": "周黑鸭", "cat": "鸭🦆", "group": "荤菜", "todo": false, "recipe": "先对鸭子下手——鸭脖、鸭掌、鸭翅\n焯水：葱段、姜片、花椒、料酒 + 冷水把血沫煮出去，去去腥， 15min左右\n卤料：姜片，花椒，麻椒，八角，干辣椒，（香叶 桂皮 小茴香）甜面酱：老抽：生抽=1:2:6\n一罐啤酒 冰糖适量\n炖煮：加水盖上盖子焖煮50分钟，汤汁收到一半时记得来回翻拌一下均匀入味。\n鸭翅熟的快可以先捞出来，然后放入素菜再煮10分钟。（素菜可以放土豆片、藕片、鹌鹑蛋、海带结……等等。）\n最后盛出，撒上白芝麻。\n如果不着急吃，泡上一晚会更加入味。也可以放入冰箱冷藏一下，肉质会更加紧实。", "links": [], "videoText": ""}, {"name": "盐水鸭", "cat": "鸭🦆", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "啤酒鸭", "cat": "鸭🦆", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "酸萝卜老鸭汤", "cat": "鸭🦆", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "慢煎橙香鸭", "cat": "鸭🦆", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/mvUP02MPv8"]], "videoText": ""}, {"name": "胡椒鸭", "cat": "鸭🦆", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/4drPeMlBdmQ"]], "videoText": ""}, {"name": "酸菜鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "酸菜+小米辣+泡椒（可以剁碎）+ 干辣椒+红花椒+青花椒 炒香，下开水\n开锅后下鱼\n青花椒煸热油浇上去", "links": [], "videoText": ""}, {"name": "烤鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "处理：鱼背从鱼尾开刀，切开鱼头后，开鱼腹清洗，划开鱼尾和鱼头出开刀使鱼平整。 腌制：葱，姜、适量盐、15克生抽（一勺），少许花椒、两个八角、水冲开，腌制鱼过夜。\n撒料：鱼擦干，鱼腹面刷油、撒孜然粉、辣椒粉、花椒粉、香菜籽粉、盐，鱼腹朝下置于烤架上，烤架置于加锡纸的烤盘上，鱼皮面刷油。\n烤制：烤箱245摄氏度烤25分钟、鱼皮面撒调料，再烤5分钟，烤炙2分钟", "links": [], "videoText": ""}, {"name": "汪鱼丝汤", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "【酸辣鱼丝】需要准备的食材\n【主料】黑鱼一条（草鱼、鲈鱼、牙鲆鱼）\n【辅料】金针菇、香菜、大葱生姜、鸡蛋、水淀粉\n【调料】料酒、胡椒粉、盐、香醋、味精\n具体烹饪过程\n1、将黑鱼去骨后，斜刀把鱼肉片下（不要鱼皮），清洗干净再切成稍微粗一点的丝，再稍微清洗一下备用\n2、碗中打入一个鸡蛋，加一点点盐、一点点水淀粉，搅拌均匀备用。\n3、用餐巾纸蘸上油，在锅中擦上一层油膜。锅均匀受热后倒入蛋液，转动锅摊成蛋饼。定型后翻面关火，利用余热熥一熥\n4、将鸡蛋饼卷起来切成细丝，金针菇从中间切开，香菜切成一寸长的段，葱姜切丝\n5、往鱼丝中加一点料酒、一点点盐、蛋清抓拌至发粘，加少量水淀粉搅拌均匀，再加少许油拌一下\n6，起锅烧水，往锅中加一点料酒、1克多盐，水开后关火，慢慢下入鱼丝（最好一根根下），全部下完后开火，开锅后用勺推一下即可出锅。\n7、金针菇焯一下水，水开后即可捞出\n8、洗锅加少许油下入葱姜丝炒香，加金针菇，一点点盐，一点点料酒翻炒几下。\n9、盛出一部分配料后加入清水、料酒、一勺香醋 （米醋多放，陈醋少放，注意口味）、2小勺胡椒粉（多放，重点）、适量食盐，加入适量水淀粉勾成薄芡，再倒入鱼丝、香菜根，加一点点香油，开锅后即可出锅装盘，最后加上鸡蛋丝、香菜叶即可食用。\n特点：非常淡雅、色彩丰富、口感嫩滑脆爽、复合口以咸鲜为主微辣微酸\n注意：水滑时鱼丝要分多次慢慢下入锅中", "links": [["B站", "https://www.bilibili.com/video/BV1Et4y1b7G4"]], "videoText": ""}, {"name": "蒸鲈鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "清蒸，开锅12分钟", "links": [], "videoText": ""}, {"name": "台州家烧鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "家烧黄鱼：黄鱼清洗干净，鱼背划上几刀，用厨房纸擦干。锅里放油，油温要稍微高一点，下黄鱼，煎至两面焦黄，沿锅边洒点黄酒，放葱姜，加一点点糖（有红糖更好）加一点点醋，再加一点鲜酱油，加沫过黄鱼的水，炖一下，看鱼汤在鱼身下一点了，放点盐（咸淡这个时候调）再煮个半分钟样子，放葱，起锅装盘。", "links": [], "videoText": ""}, {"name": "青花椒煎鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "1️⃣改刀鱼\n鱼表面擦很干、鱼身对半片开后划几道，铺匀盐和白胡椒去腥入底味（新鲜鱼不加酒，煎时容易粘锅）\n2️⃣调料汁\n小锅放油下蒜片、干葱片和大量新鲜青花椒（比干的味道更清新明亮）全部炒透炒香关火，加蚝油、生抽、白糖和一点开水调匀\n3️⃣锅热到冒烟加油下鱼，两面煎，鱼皮要煎到金黄酥脆出锅（鱼皮面较厚比另一面时间长一点点）\n4️⃣灵魂料汁浇给～～～～\n你就吃吧，巨香巨入味，口感带点酥脆", "links": [], "videoText": ""}, {"name": "鲈鱼豆腐煲", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "1 海鲈鱼+料酒+淀粉+姜丝＋食盐，抓拌均匀金门豆腐（硬豆腐），蘸鸡蛋液\n2 煎至两面金黄\n3 海鲈鱼也煎至两面金黄\n4 煲里头放洋葱、大蒜炒香，加点杏鲍菇，放上豆腐和鲈鱼\n5 淋上酱汁（1勺耗油+2勺生抽+半勺老抽+少许食盐+鸡精+香油），加适量清水闷煮十分钟左右", "links": [], "videoText": ""}, {"name": "剁椒鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "水煮鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "意式柠檬烤鲈鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/5R20PNdUIlc"]], "videoText": ""}, {"name": "豆豉香煎鲈鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/75spsp1LjsU"]], "videoText": ""}, {"name": "湘味刨盐鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/79BNthLllLh"]], "videoText": ""}, {"name": "泡椒片片鱼", "cat": "鱼🐟", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/1QJWRQmpX1D"]], "videoText": ""}, {"name": "虾滑", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "大虾去头去壳去虾线，剁碎/绞碎机，每200克虾仁，盐1克、白胡椒粉1克、淀粉3克、蛋清1个，搅拌均匀。", "links": [], "videoText": ""}, {"name": "油焖大虾", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "香煎扇贝", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "芹菜炒虾仁", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "爆炒酱香鱿鱼", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "白灼鱿鱼", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "葱油白灼是最简单的做法〈\n10分钟完成\n一定要就着白洋葱丝一起吃，脆甜和鲜美完美融合型，看到还有垫豆芽的，应该也不错\n① 洗干净的鱿鱼切段\n2 切葱丝泡水，白洋葱切丝垫盘底\n3\n烧水 加入葱姜料酒，水开放鱿鱼焯水1-2分钟\n4\n捞出的鱿鱼 ＋蒸鱼豉油和葱花\n⑤热油＋花椒粒，淋油即可", "links": [], "videoText": ""}, {"name": "烤章鱼腿", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "costco章鱼腿 烤完+辣椒面+芝麻+五香粉etc", "links": [], "videoText": ""}, {"name": "空气炸锅三文鱼手卷", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "空气炸锅三文鱼手卷\n315分钟健康低脂快手菜\n忙碌的一天，美食也不能将就！今天分享我的空气炸锅三文鱼手卷，真的超简单、超好吃、也超健康\n【材料】\n三文鱼1磅 酱油3勺＋蜂蜜1勺＋盐和胡椒 新鮮姜蒜未 米饭＋海苔\n【做法】\n混合酱油、蜂蜜、姜蒜末、盐胡椒腌制三文鱼\n将米饭铺在海苔上，扣成塔克形状。\n将腌好的三文鱼放在米饭上放入空气炸锅，375°F烤10分钟\n成品外酥里嫩，蜜汁三文鱼搭配烤的焦焦的米饭和海苔，一口下去满满幸福感！快去试试吧", "links": [], "videoText": ""}, {"name": "葱油响锣片", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "葱油鱼露响螺片。除了切螺肉的时间，是10min可以搞定的快手菜。我一次会把3lb螺肉全都切片，分开真空包装。\n\n1. 螺肉切薄片，开水泡5min过冷水。\n2. 中小火油煎葱，葱煎至黄色后取出葱。稍微降温后加入酱油和少许鱼露。用筷子搅一下。\n3. 葱丝摆在螺肉上，浇葱油", "links": [], "videoText": ""}, {"name": "Ceviche", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "Ceviche这道菜的原理是利用柠檬汁的酸性使鱼肉表面蛋白质变性，进而低温做熟鱼肉。意大利的Salmon Crudo和秘鲁的Ceviche很像，但是辅料不同，鱼肉选材不同。Crudo的话，鱼表面并不算被酸腌熟了。\n\n三文鱼去皮切片。\n如果大家不放心，可以速冻7天，拿出来泡盐水，冷藏解冻再用。未来会出自己在家制作可生食鱼肉的帖子。\n\n大量柠檬汁+橄榄油+一些盐混合，放入切好的鱼。轻轻翻拌三五分钟之后，鱼就很神奇的熟了。为了出品美观，请把鱼表面擦干净一点，要不然出盘之后葡萄柚汁上会漂小油花，不好看。别的倒是无所谓。\n\n摆盘用到的葡萄柚，取肉且保留果汁，果汁浇在盘底备用。Rewe的沙拉里惊现三色堇，拿来装盘。便宜水芹菜，也弄上。最后一组装，完事儿！", "links": [], "videoText": ""}, {"name": "意式海鲜烩饭", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "1⃣️洋葱切丁 番茄切丁 在番茄中加入足量番茄酱拌匀（我加了两小包 一定要多加味道才浓郁）再加迷迭香调味\n2⃣️海鲜：我用的是冷冻海鲜（虾仁 海虹 鱿鱼圈）先煮化冻 然后用黄油煎至两面微焦\n3⃣️锅里加黄油 洋葱炒香 倒入番茄 炒出汁水 再加入适量清水/白葡萄酒\n4⃣️生米倒入（我用的做好的冷冻米饭）加入盐、糖、黑胡椒调味 盖上锅盖小火焖煮至米饭断生\n5️⃣铺上海鲜焖熟，开盖撒黑胡椒和欧芹装饰", "links": [], "videoText": ""}, {"name": "海皇粉丝堡", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "【主材】海鲜什锦500g、绿豆粉丝3把\n【辅材】洋葱、大蒜、生姜、红葱头\n【点缀】芹菜粒、红椒粒\n【调料】生抽、老抽、柱侯酱、米酒、盐、糖\n•\n👩🏻‍🍳做法\n1⃣️食材准备\n· 绿豆粉丝用冷水泡30分钟，剪短一些，加1勺生抽、1勺老抽拌匀上色\n· 大蒜、生姜、红葱头一起打碎；芹菜、红椒切丁\n· 准备料汁：1勺柱侯酱、2勺生抽、半勺糖\n2⃣️起锅倒油，把海鲜什锦倒下去炒一下，加半勺盐、1圈米酒，炒熟后捞出控干\n3⃣️重起一锅，先爆香葱姜蒜末，接着下粉丝，用筷子炒到变色，下料汁、炒过的海鲜、芹菜红椒丁，翻炒均匀后移到砂锅里\n4⃣️砂锅烧热，倒底油后铺一层洋葱丝，接着把炒好的粉丝转移进去，盖上盖子烹一圈米酒，中火半分钟就可以上桌啦！", "links": [], "videoText": ""}, {"name": "马赛鱼汤 Bouillabaisse", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "准备食材\n海鱼（如鲈鱼、鳕鱼、石斑鱼等）共500克、虾200克、青口贝200克、蛤蜊200克、洋葱1个、番茄2个、大蒜3瓣、芹菜1根、胡萝卜1根、橄榄油30毫升、藏红花5根、香叶2片、百里香少许、盐5克、黑胡椒粉3克、面包适量。\n制作步骤\n1. 海鱼处理干净切块，虾洗净去头，青口贝、蛤蜊洗净。洋葱、番茄、大蒜、芹菜、胡萝卜切丁备用。\n2. 锅中倒橄榄油，放入洋葱丁、大蒜丁炒香，加入番茄丁炒出汁，再放入芹菜丁、胡萝卜丁翻炒均匀。\n3. 倒入适量清水，放入藏红花、香叶、百里香，大火煮开后转小火煮15分钟左右。\n4. 放入海鱼块，煮10分钟，再加入虾、青口贝、蛤蜊，继续煮5 - 8分钟至海鲜熟透。\n5. 最后加入盐、黑胡椒粉调味。将面包切片，烤至金黄，搭配鱼汤食用。\n\n\n传统版：\n这道经典的马赛海鲜炖菜用了各种各样的鱼类和贝类🦀包括螃蟹、鱿鱼🦑贻贝和龙虾。 这是海鲜爱好者的最爱，虽然步骤略多，但值得一试。 海鲜的骨头、头和贝壳构成了浓汤的基础。 做这道菜你需要一个大汤锅。👨‍🍳\n\nBouillabaisse 马赛鱼汤🇫🇷\n3.5kg Fish 鱼（各类杂鱼）\n30ml Olive oil 橄榄油\n100g Onions 洋葱\n50g Leeks 京葱\n100ml White wine 白葡萄酒🥂\n15ml Pernod 茴香酒🍾\n10g Garlic chopped 蒜碎\n1g Saffron 藏红花\n100g Carrot 胡萝卜🥕\n15g Tomato paste 蕃茄膏\n2.5L Fish stock 鱼基础汤\n50g Fennel 茴香\n1g Fennel seed 茴香籽\n1 Thyme 百里香🌿\n100g Tomato puree 番茄泥🍅\nSalt and pepper to taste 盐，胡椒适量\n40ml Olive 橄榄油\nCayenne pepper to taste卡宴辣椒粉适量\n\nMethod\n1⃣根据烹饪方法，将鱼(大鱼切成片，小鱼整条)分成两组🐠\n.2⃣锅中放入橄榄油，炒香洋葱，大蒜[哇R]\n3⃣将除鱼外的所有蔬菜材料混合，文火炒20分钟。\n4⃣加入需要较长时间烹煮的鱼🐟小火慢炒10分钟。\n5⃣加入需要较短烹饪时间的鱼，继续小火煮5分钟。\n6⃣加入适量茴香酒🍾藏红花，茴香籽，蕃茄膏，白葡萄酒翻炒。炒去酒精。\n7⃣加入番茄泥，鱼基础汤，百里香🌿适量盐调味。大火煮开，转小火煮20分钟。\n8⃣把煮好的汤过滤。\n9⃣剩下的鱼用盐调味，用平底锅煎熟 。倒入过滤好的汤。\n🔟碗中放入制作好的汤和鱼肉，烤好的法棍（涂抹了蒜味辣椒酱）适量欧青碎装饰即可🍽", "links": [], "videoText": ""}, {"name": "Chimichurii Shrimp", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "🛒 所需食材 (Ingredients)核心提示： 请务必使用平叶欧芹 (Flat-leaf Parsley/Italian Parsley)，尽量不要使用卷叶欧芹（口感较硬）或香菜（味道完全不同）。\n• 新鲜欧芹 (Parsley): 1 杯 (切得很碎，去掉粗茎)\n• 大蒜: 3-4 瓣 (切成极细的碎末)\n• 干牛至 (Dried Oregano): 2 茶匙 (这是经典风味的关键)\n• 特级初榨橄榄油: 1/2 杯 (约 120ml)\n• 红酒醋 (Red wine vinegar): 2 汤匙 (如果没有，可以用柠檬汁代替，但红酒醋最正宗)\n• 干红辣椒碎 (Red chili flakes): 1 茶匙 (根据对辣度的喜好调整)\n• 海盐: 1 茶匙\n• 黑胡椒粉: 1/2 茶匙\n🔪 制作步骤 (Instructions)\n1. 准备香草：\n将欧芹洗净并彻底擦干（水分过多会让酱汁变质且味道变淡）。去掉粗茎，只留叶子和嫩茎，用刀切碎。注意： 尽量用手切，不要用搅拌机。手切能保留叶子的质感和鲜亮的绿色；搅拌机容易过度氧化，让酱汁变成浑浊的糊状。\n2. 混合干料与湿料：\n找一个中等大小的碗，先将切碎的欧芹、大蒜碎、干牛至、辣椒碎、盐和黑胡椒混合在一起。\n3. 加入液体：\n加入红酒醋和橄榄油。\n4. 搅拌与静置 (关键步骤)：\n用叉子轻轻搅拌均匀。虽然现在就可以吃，但强烈建议在室温下静置 15-20 分钟。这段时间能让干牛至复水，大蒜的辛辣味也会融入油中，味道会更融合。", "links": [], "videoText": ""}, {"name": "鲜橙酱金枪鱼 / Orange Reduction Sauce with Seared Tuna", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "🍊 柠檬白酒蜂蜜橙汁酱 (食谱建议)\n这款酱汁的重点在于“Reduction”（浓缩），通过慢火加热，让水分蒸发，风味物质浓缩，同时酱汁变得粘稠。\n\n你需要的材料：\n橙汁 (Orange Juice): 约 1 杯 (240ml) - 最好是鲜榨的，但瓶装纯果汁也可以。\n\n白葡萄酒 (White Wine): 约 1/4 杯 (60ml) - 偏干（Dry）的白葡萄酒最好。\n\n蜂蜜 (Honey): 约 1-2 汤匙 (Tablespoon) - 取决于你的橙汁甜度和你的口味。\n\n柠檬 (Lemon): 1 个（需要柠檬皮屑和柠檬汁）。\n\n(可选，但强烈推荐): 一小块冷黄油 (Cold Butter)，约 1 汤匙。\n\n(可选): 盐 (Salt) 和 少量黑胡椒 (Black Pepper) 调味。\n\n烹饪步骤：\n准备柠檬： 在开始之前，用擦皮器擦下半个柠檬的皮屑（Zest）（注意只擦黄色的表皮，避开白色的苦味部分）。然后将柠檬对半切开，挤出汁备用。\n\n浓缩白葡萄酒： 在一个小平底锅中，倒入白葡萄酒（和可选的1瓣蒜末或少许洋葱末，如果你有的话）。用中火加热，直到白葡萄酒浓缩（Reduce）至一半，酒精味挥发掉。\n\n加入橙汁和蜂蜜： 倒入橙汁和蜂蜜。搅拌均匀。\n\n慢火浓缩 (The Reduction)：\n\n将火调小，保持微沸（Simmering，即锅边冒小泡，而不是剧烈翻滚）。\n\n耐心地让酱汁慢慢浓缩。这个过程可能需要 10-15 分钟（取决于你的锅和火力）。\n\n当酱汁的量减少到原来的一半左右，并且开始变得有些粘稠时，它就快好了。\n\n测试浓稠度：\n\n“挂勺” (Nappé)： 关键一步。用一个勺子舀起酱汁，然后用手指在勺子背面划一下。如果能划出一条清晰的、不会马上合拢的路径，说明浓稠度就够了。\n\n最后调味（关火）：\n\n关火（这一步很重要，特别是要加黄油的话）。\n\n加入准备好的柠檬汁（先加一半，尝尝酸度）和柠檬皮屑（增加香气）。\n\n尝一下味道，用盐和（如果喜欢）一点点黑胡椒来平衡甜味和酸味。如果太酸，可以再加一点点蜂蜜。\n\n(可选) 蒙特黄油 (Monter au Beurre)：\n\n在关火的锅中，加入那一小块冷黄油。\n\n轻轻晃动平底锅，或用打蛋器快速搅动，让黄油乳化（Emulsify）到酱汁中。这会使酱汁瞬间变得光滑、有光泽，口感更浓郁。", "links": [], "videoText": ""}, {"name": "香煎三文鱼", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "蒜香爆香鱿鱼", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/2GY7ItMJpxq"]], "videoText": ""}, {"name": "辣卤海鲜", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/43KrQ9VjRWK"]], "videoText": ""}, {"name": "甜麻肥虾", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/2yBgnSnHikB"]], "videoText": ""}, {"name": "橙子煎扇贝", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/6VpZVQXP7Tt"]], "videoText": ""}, {"name": "西班牙风味辣章鱼", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/8oF2lNJVDNx"]], "videoText": ""}, {"name": "虾滑鱿鱼饼", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/3zhP1Xy170B"]], "videoText": ""}, {"name": "九层塔北极贝", "cat": "海鲜🦞", "group": "荤菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/9omaxfbQ7B6"]], "videoText": ""}, {"name": "醋溜白菜", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "葱 姜片 花椒 辣椒 煸锅\n生抽:醋=1:1 盐适量", "links": [], "videoText": ""}, {"name": "酸辣土豆丝", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "清炒芦笋", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "腊肉炒香干还炒笋干", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "炸豆腐", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "西红柿炒蛋", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "麻婆豆腐", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "家常豆腐", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "黄豆芽炒粉条", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "粉条提前焯水煮熟，过冷水备用。蒜+干辣椒炒香，+豆芽炒到断生，+粉条，2勺生抽1勺蚝油1勺老抽，一点醋，加水煮一煮出锅", "links": [], "videoText": ""}, {"name": "普罗旺斯炖菜 Ratatouille", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "5个番茄（其中2个做汤底）、1个茄子、1个西葫芦、洋葱1/4个、蒜5瓣\n盐、黑胡椒、罗勒、百里香\n橄榄油、其他替换1-2个番茄的你想吃的蔬菜（土豆、杏鲍菇等）\n[吧唧R]【做法】\n1. 两个番茄烤火过凉水后去皮，和五瓣蒜、1/4个洋葱切丁。橄榄油（也可以黄油）炒制蒜瓣、洋葱丁出香味儿后，加番茄丁炒制。可以多收收汁，但千万别加水。想更浓郁可以少加一点番茄酱，觉得太酸也可以微微加一点糖。\n2. 汤底进料理机打成红酱，倒入之后入烤箱的烤盘/烤锅，铺平。容器别选太薄的。\n3. 一个茄子、一个西葫芦、三个番茄切片，当然也可以把1-2个番茄替换成你想吃的别的蔬菜，比如土豆、杏鲍菇。尽量切的一样厚度，在保证安全的前提下根据自己的刀工水平尽量切薄些。\n4. 蔬菜们交叉类别摆盘，均匀撒上橄榄油，撒上适量盐/海盐、罗勒碎、百里香碎。\n5. 上铺烘焙纸/锡纸。只是铺上！别封起来！要留出气儿的地方！放入烤箱，上下火220度20分钟。\n6. 二次烤制：去掉烘焙纸/锡纸后220度上下火10分钟。标准为二次烤制后茄子皮起皱，时间不够的话可以多烤一会儿～\n7. 完成✅", "links": [], "videoText": ""}, {"name": "豆角炒肉", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [["小红书", "http://xhslink.com/a/S1iw1bwc62jgb"]], "videoText": ""}, {"name": "炝炒包菜", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [["B站", "https://b23.tv/vVHW277"]], "videoText": ""}, {"name": "辣豆花", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "炝炒空心菜", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "葱烧豆腐", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "清炒豆苗", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "白菜炒年糕", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "跳水泡菜", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "山药炒木耳", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "青椒炖豆腐", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/4NO5C3mXQmL"]], "videoText": ""}, {"name": "椒麻杏鲍菇", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/3aW8GyePMPB"]], "videoText": ""}, {"name": "低卡牛肉烤时蔬", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/4CTdE20tNdC"]], "videoText": ""}, {"name": "终极烤土豆", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/8vi1Qmf9kAP"]], "videoText": ""}, {"name": "无水鸡肉蔬菜锅", "cat": "蔬菜🥬", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/8M3b9QZoMKE"]], "videoText": ""}, {"name": "茶叶蛋", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "鸡蛋+一包红茶+八角 香叶 桂皮 花椒\n凉水下锅 煮15min\n把鸡蛋敲碎\n加盐 糖 煮开3min\n泡一夜", "links": [], "videoText": ""}, {"name": "凉拌木耳黄瓜腐竹", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "万能凉拌：半勺糖+半勺盐+两勺生抽+一勺蚝油+一勺香油+两勺油泼辣子+两勺醋；还可以+小米辣+蒜末+热油；醋和生抽的比例自己调节，根据想要酸口or咸口来调整", "links": [], "videoText": ""}, {"name": "日式酱油蛋", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "▪️水开下鸡蛋，煮6分钟捞出迅速过凉水，剥皮（过凉水容易剥皮）\n▪️准备需要的配菜：小米辣、洋葱、香菜、大蒜全部切碎\n▪️调料汁：生抽150ml、清水150ml（生抽和水比例1:1即可）、一大勺白糖、一勺白芝麻，搅拌均匀\n▪️组装：剥壳的鸡蛋、配菜、料汁全部倒入保鲜盒中，冰箱冷藏一晚", "links": [], "videoText": ""}, {"name": "凉拌黄喉鱼肚", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "皮蛋豆腐", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "炝拌豆腐丝", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/pLVrjwElYD"]], "videoText": ""}, {"name": "芹菜拌豆腐", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/JFDf0Snbxb"]], "videoText": ""}, {"name": "紫菜脆黄瓜", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/2ulg1eJ31kL"]], "videoText": ""}, {"name": "炝拌土豆丝", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/4OCsUcMmyfr"]], "videoText": ""}, {"name": "油泼百叶", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/OAEuBt5F4I"]], "videoText": ""}, {"name": "老醋四样", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/45oRyMsAx8g"]], "videoText": ""}, {"name": "藤椒藕片", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/54iyErs9VNj"]], "videoText": ""}, {"name": "腌海带", "cat": "凉菜🥗", "group": "素菜", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/hLLmcHBI2"]], "videoText": ""}, {"name": "日式牛肉饭", "cat": "饭🍚", "group": "主食", "todo": false, "recipe": "酱汁：酱油:料酒:米酒:水4:2:2:10 蜂蜜10g 苹果汁/泥 20g 柠檬汁一点点\n步骤：肥牛焯水，白洋葱煎好，放牛肉，倒酱汁，闷5min", "links": [], "videoText": ""}, {"name": "牛肉土豆咖喱饭", "cat": "饭🍚", "group": "主食", "todo": false, "recipe": "泰式：tj咖喱酱1/2瓶+ a can of coconut milk\n日式：加咖喱块即可", "links": [], "videoText": ""}, {"name": "酸辣粉", "cat": "饭🍚", "group": "主食", "todo": false, "recipe": "食材：一把红薯粉，蒜末，小米辣，葱末，白芝麻，辣椒面\n做法：\n1⃣️配料碗中浇上热油爆香，爆香后加入三勺生抽，两勺陈醋（爱吃醋的宝子们可以自行定量哦）适量盐和鸡精，一勺白糖搅拌均匀备用\n2⃣️锅中烧水水开加入粉干煮熟（有时间的宝子可以提前泡干这样煮更快）煮熟后将料碗中加入两勺煮粉的水，再把粉捞入碗中搅拌均匀，最后撒上葱花就完成啦！（家里有香菜和花生米的宝贝，加上就更加完美啦！）", "links": [], "videoText": ""}, {"name": "鸡肉虾仁咖喱饭", "cat": "饭🍚", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "鱿鱼猪肉打抛饭", "cat": "饭🍚", "group": "主食", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/1tKrZ40LtRa"]], "videoText": ""}, {"name": "板栗南瓜腊肠焖饭", "cat": "饭🍚", "group": "主食", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/5BVBDe2QwFu"]], "videoText": ""}, {"name": "电饭煲海南鸡饭", "cat": "饭🍚", "group": "主食", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/9RMx19IoF3d"]], "videoText": ""}, {"name": "鲜虾意面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "牛肉乌冬面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "西红柿鸡蛋面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "油泼面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "两勺醋 两勺生抽 一勺糖 一勺盐 辣椒粉（翠红的话可少盐）", "links": [], "videoText": ""}, {"name": "炝锅面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "葱碎炝锅，下萝卜丝和白菜丝，盛出来，下肉馅，炒香，然后下刚才的萝卜丝白菜丝，下热水，白胡椒 盐 生抽，下面，出国前下锅边醋", "links": [], "videoText": ""}, {"name": "黑椒牛肉乌冬面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "准备： 面，牛肉，黑胡椒，盐，葱，姜，料酒\n1. 牛肉切成条或者任何形状，在水中泡15分钟（去除血水），这一步还可以在水中加入小苏打（baking soda）让肉变得更嫩，不要加多，加多了会苦，一小勺就好（1g） /  新鲜牛肉可以直接炒\n2. 锅中加水，加一小勺盐（给面调底味），水烧开后放入面煮熟后捞出\n3. 焯水：锅中加水（凉水）, 把处理好的牛肉放进去，冷水放牛肉，加料酒，拍碎/切好的姜，葱，一起煮。\n4. 锅中会出现很多血沫，把血沫捞出，等你发现没有新的血沫出现就是焯好水了，把牛肉捞出来即可\n炒制：\n1. 锅热下油，放入牛肉（记得把牛肉的水沥干，不然会油会炸），翻炒牛肉，炒一两分钟就好\n2. 放入面，放入任意蔬菜，和牛肉一起翻炒\n3. 放入少许盐，生抽，很多黑胡椒，调味\n4. 出锅", "links": [], "videoText": ""}, {"name": "辣咖喱牛肉乌冬面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [["小红书", "http://xhslink.com/a/FHIr8Q7AN2jgb"]], "videoText": ""}, {"name": "阳春面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "火腿通心粉", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "小龙虾拌面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "番茄肉酱意面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "葱油拌面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "4生抽2老抽1蚝油1-2醋", "links": [], "videoText": ""}, {"name": "虾滑扯面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/4qok7sq2CJs"]], "videoText": ""}, {"name": "酸菜肉丝炝锅面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/8FtGMjgzo4J"]], "videoText": ""}, {"name": "皮蛋肉酱拌面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/2P9MBixJWVb"]], "videoText": ""}, {"name": "双色珍珠海鲜意面", "cat": "面🍝", "group": "主食", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/1dl4lJHHerR"]], "videoText": ""}, {"name": "番茄牛肉米线", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "过桥米线", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "【汤底】我试了各种鸡汤，感觉就图二这一款最好吃（Swanson Chicken Broth），costco target都有卖。我一般放3罐，这个很淡，需要额外再放点浓缩鸡汁，盐，一些花椒粉调一下（有一次我家炖了鸡汤，更像！）\n【米线】之前我们一直吃的江西濑粉，就是跟螺蛳粉很像的细的粉，也可以买bun bo hue，就是越南的一种粉，粗细都一样，是白色的。缺点是不太好煮，经常要煮完再焖20分钟之类的，或者就得提前泡，反正我们是想不起来哈哈。后来又试了一下图三这种粗的粉，粗细程度我很满意，就是这个粉是半透明的那种，口感有点弹弹的黏黏的，但是胜在好煮，粗度又正好，我们现在就都吃这个粉了（这个粉还有一款跟它长得非常像，字都是一样的，但是字是红色的，我感觉吃起来没什么区别）\n【豆皮】这个对我来说很重要！图四这一款（我们一般吃同一个牌子更细的那一款，但是这次hmart没货了），真的跟国内一样软！特别好吃！我们还经常买来凉拌菜什么的，强烈推荐！中超那种高碑店豆腐丝，太硬了，不好吃\n【豆芽】【油菜】这个没啥可说的了，还可以放鹌鹑蛋！我还专门寻找了大连那种细豆苗，美国超市有卖，就是贵。。一小点（就是我一口的量）就要$8，算了不吃了\n【肉酱】我本人是不喜欢吃肉酱的，但是我老公跟我回国吃了几次以后就爱上了米线，但他需要吃肉酱，于是他就自己弄点肉馅+豆瓣酱啥的炒一炒弄一小碗\n【麻油】这是米线的灵魂！我吃来吃去最好吃的就是这个五丰黎红花椒油，我都买1.8升的那种大瓶的，因为每次吃都要狂放一大堆\n【油泼辣子】这个也是必须要有，我们家的是自己做的\n【醋】我不爱吃醋，但是周围人很多都喜欢放醋，我老公和娃也都要放很多\n\n我们一家三口（学龄前小娃），都饭量挺大，因为要控制主食摄入，每次都是多菜少粉，所以每次的量是一袋图三那个粉+三罐鸡汤+3盒豆腐丝+两包豆芽+小半包油菜。最后都能撑死", "links": [], "videoText": ""}, {"name": "剁椒海鲜炒粉", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "云南小锅米线", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "", "links": [["小红书", "https://xhslink.com/m/7zrTGgveAvd"]], "videoText": ""}, {"name": "大连过桥米线", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "", "links": [["小红书", "https://xhslink.com/m/4EfNUo0zBdj"]], "videoText": ""}, {"name": "酸菜牛肉米线", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "", "links": [["小红书", "https://xhslink.com/m/3IzhWqifiYn"]], "videoText": ""}, {"name": "雪菜牛肉米线", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "", "links": [["小红书", "https://xhslink.com/m/5b2eDr4gcxc"]], "videoText": ""}, {"name": "泡椒牛肉米粉", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/AYqgSemTZpF"]], "videoText": ""}, {"name": "鸡汤米线", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "杂酱米粉", "cat": "米粉🍜", "group": "主食", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/tXRJiep63u"]], "videoText": ""}, {"name": "鲜肉馄饨", "cat": "带馅的🥟", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "西葫芦鸡蛋虾仁水饺", "cat": "带馅的🥟", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "芹菜猪肉水饺", "cat": "带馅的🥟", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "韭菜鸡蛋水饺", "cat": "带馅的🥟", "group": "主食", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "白菜猪肉水饺", "cat": "带馅的🥟" 水蒸蛋", "cat": "早餐🍳", "group": "", "todo": false, "recipe": "蛋：水 = 1:1.5，加盐，两个蛋+水 微波炉3min，3个蛋+水蒸10分钟闷8分钟", "links": [], "videoText": ""}, {"name": "热燕麦", "cat": "早餐🍳", "group": "", "todo": false, "recipe": "热牛奶+oats+葡萄干+红枣", "links": [], "videoText": ""}, {"name": "蓝莓隔夜燕麦", "cat": "早餐🍳", "group": "", "todo": false, "recipe": "蓝莓隔夜燕麦\n食材：\n①1杯冷冻蓝莓（不冷冻也可）\n21杯牛奶（可以换成任何你喜欢的液体）\n31杯燕麦\n41汤匙奇亚籽\n5半杯酸奶\n做法：\n①将所有材料放入罐子或容器中，搅拌均匀。\n2等待大约3分钟，然后再次搅拌，以避免奇亚籽结块。\n③盖上盖子，在冰箱中存放至少一小时，直到浓\n稠~好吃。", "links": [], "videoText": ""}, {"name": "吐司蛋饼", "cat": "早餐🍳", "group": "", "todo": false, "recipe": "吐司切块，蛋+牛奶+面粉+葡萄干，下锅一起，做成饼饼，+蜂蜜", "links": [], "videoText": ""}, {"name": "北非蛋", "cat": "早餐🍳", "group": "", "todo": false, "recipe": "食材：洋葱、口蘑、番茄、红椒、鸡蛋、香菜、胡椒粉、孜然粉、味好美 番茄沙司挤挤瓶360g\n\n1️⃣洋葱、红椒、番茄切成丁，口蘑切片，加橄榄油翻炒8分钟，炒到番茄出汁水\n2️⃣加入番茄酱，加一点水再煮一会儿，挖两个洞，打入两个鸡蛋，中小火分钟煮6分钟\n3️⃣加入香菜、孜然粉、黑胡椒，出锅", "links": [], "videoText": ""}, {"name": "恰巴塔三明治", "cat": "早餐🍳", "group": "", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "蛋挞", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "【蛋挞皮】中筋面粉150克、盐2克、水80克、无盐黄油85克、面粉(适量)防粘用\n蛋挞液：牛奶110g heavy cream 180g sugar 20g 鸡蛋一个+蛋黄一个\nor replace some heavy cream with旺仔牛奶\n400f 25min注意颜色 + broil", "links": [], "videoText": ""}, {"name": "巴斯克蛋糕", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "Cream cheese 300g室温软化➕40g糖➕2个全蛋➕1个蛋黄分次放入➕180g奶油➕12g玉米淀粉 混合就是原味。然后就可以烤了👌 抹茶可另外加，10g起不然没有味道\n450F 22min转broil上色 3-5min\n\n更小的version\n\nCream Cheese: 227g（室温软化，先用刮刀按压顺滑）Trader Joe's 芭乐果酱: 约 40g-50g（可以和软化的芝士先混合均匀，避免结块）糖: 30g （加了果酱的话就是0g - 10g）鸡蛋: 2个全蛋 + 1个蛋黄（分次加入，搅打均匀）也可以减少一个蛋 奶油 (Heavy Cream): 140g玉米淀粉: 10g", "links": [], "videoText": ""}, {"name": "红糖冰粉", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "冷冻桃子奶油", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "Frozen Peaches + Cream |冷冻桃子和奶油\n1 cup heavy whipping cream\n2 T powdered sugar\n1/4 t pure vanilla extract, to taste\n1 frozen peach\nHoney roasted pistachios\nHoney, to taste\n1. In a cold mixing bowl, whip together your cream, powdered sugar, and vanilla on medium/high speed until soft peaks form.\nShould take a few minutes.\n2. Grate your frozen peach directly on top and add whatever toppings you like. Enjoy!", "links": [], "videoText": ""}, {"name": "Canele 可露丽", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "1. 550g牛奶+40g糖+2g香草精+40g黄油 加热 微微煮沸然后放凉 2. 1全蛋3蛋黄+100g糖3g盐打在一起 3. step2的蛋液加入step1的凉牛奶+150g cake flour 打在一起 过筛 4. +50ml朗姆酒 5. 保鲜膜贴面冷藏48h 6. 450f烤15-20分钟 350f烤50分钟+根据上色情况升温上色", "links": [], "videoText": ""}, {"name": "桂花糖藕", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "1. 糯米提前浸泡，泡发一晚备用\n2. 莲藕去皮，在盖子3cm处切下\n3. 用筷子将糯米灌进莲藕并用筷子压实。\n4.灌满后用牙签固定，加入水，冰糖，红枣，枸杞，桂花。\n5. instant pot meat功能45mins，自然放气，闷4-5小时。", "links": [["小红书", "http://xhslink.com/o/5wOYdlXgWrS"]], "videoText": ""}, {"name": "意式奶冻 Panna Cotta", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "牛奶275g\n白砂糖15g\n淡奶油125g\n\n吉利丁3.5g + 25g水化开\n牛奶+糖加热到五六十度加入吉利丁搅拌均匀\n加入淡奶油搅拌均匀\n冷藏四个小时以上\n\n（一包walmart吉利丁刚刚好够做两份的量，everything x2 from top）", "links": [], "videoText": ""}, {"name": "提拉米苏", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "300g马斯卡彭芝士，3个鸡蛋，手指饼干，咖啡液，三勺糖，可可粉，marsala/酒\n蛋清蛋黄分离，蛋清打发到干性发泡，蛋黄分三次加糖打发，打到微微发白，把马斯卡彭加入到打发到的蛋黄里，手指饼干粘咖啡液，要快！然后把蛋白蛋黄加起来，搅均匀，然后铺在手指饼干上，撒可可粉在上面，再来一遍饼干+奶油+可可粉。放入冰箱一晚上就可以吃了", "links": [["小红书", "http://xhslink.com/a/CUfZTGxbmYNfb"]], "videoText": ""}, {"name": "椰丝脆脆奶酥", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "黄油60g（室温软化）\n糖粉40g\n常温蛋液50g（一个大号鸡蛋）\n盐1g\n泡打粉1g\n面粉50g\n无糖椰蓉 90g（blender 磨成粗粉状）\n\n由上至下混合材料，最后得到阻力很大的粘手奶\n酥糊，完全不能上手揉的状态，是正常的，要的就是粘手！用刮刀转移到小号 ziploc食品袋里（或者夹在两张烘焙纸之间），擀成5-8mm厚的薄片，冷冻半小\n时\n冷冻后拿出，切成长条状，迅速转移到烘焙烤盘上，每块之间至少2cm距离（切条转移的动作要快别\n墨迹，奶酥糊一旦脱离冷冻解冻速度很快）\n\n要点来了：切块后将烤盘＋奶酥块再次冷冻至少10min。这步是为了防止奶酥烤时受热太快塌陷，无法维持原本的形状（本人的翻车现场在最后，不过就算塌了也不影响味道，味道依旧很好）\n\n烤箱预热160°C（320°F），预热好之后从冷冻层取出烤盘和奶酥块，直接送入烤箱，烤30min，直到表面上色，烤完不开门焖5min", "links": [["小红书", "http://xhslink.com/o/7cjlTeyS2wJ"]], "videoText": ""}, {"name": "椰蓉脆脆球", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "黄油 100g\n糖粉：55g\n蛋黄：四个\n牛奶：60g\n低筋面粉：100g\n椰蓉：220g\n\n内陷绵软，最成功的椰蓉球配方\n\n黄油室温软化加糖粉打至发白\n加入蛋黄搅拌均匀\n加入牛奶霍楞\n筛入低粉与奶粉刮拌\n最后加入椰蓉\n\n冷藏30分钟\n\n提前十分钟预热烤箱\n分成12g一个的小圆子，裹上椰蓉\n340F，30分钟\n表面上色就行", "links": [["视频", "https://xhslink.cn/o/59GPr7jqA9H"]], "videoText": ""}, {"name": "老婆饼", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "水果挞", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "芭乐腮红芝士慕斯", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "【新品guava spread芭乐酱】\n好，买！石榴味挺浓，真材实料，能看到籽。做甜品或者搭配cream cheese抹面包都ok，淡淡的桃粉腮红色很美貌\n\n【芝士慕斯底】六寸\n80g原味饼干\n40g黄油\n\n【原味芝士糊】六寸\n230g奶油奶酪\n150g淡奶油\n150g酸奶\n100g牛奶\n15g白糖\n10g吉利丁粉/片\n1️⃣吉利丁粉先用50g左右冷水泡发成啫喱状；吉利丁片同理，先用冷水泡软\n2️⃣微波炉加热100g牛奶，加入泡好的吉利丁搅拌至溶解\n3️⃣奶油奶酪隔水软化至顺滑，然后顺序加入白糖、吉利丁牛奶、酸奶、淡奶油\n\n【渐变芝士糊】\n先倒一次原味芝士糊入模具，然后将25g果酱和剩下的芝士糊混合，再从模具的中心倒入，形成第一层渐变，然后再次将剩下的芝士糊和25g果酱混合，再倒入模具……重复以上动作5-6次直到芝士糊用完，冰箱冷冻4小时以上或者冷藏过夜\n\n【抹茶奶油酱】\n150g淡奶油\n50g奶油奶酪\n30g白糖\n5g抹茶粉\n2g吉利丁粉/片\n1️⃣吉利丁先和50g热奶油混合，步骤和慕斯糊相同\n2️⃣碗里先混合奶油奶酪+白糖+抹茶粉，再加入吉利丁奶油和剩下的100g冷藏奶油\n3️⃣混合好的抹茶溶液冰箱冷藏2-4小时，然后拿出直接打发至奶油状", "links": [["小红书", "http://xhslink.com/o/7NjNMOslAWU"]], "videoText": ""}, {"name": "奶茶烧仙草", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "", "links": [], "videoText": ""}, {"name": "热牛奶醪糟", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/1freYCEkIyF"]], "videoText": ""}, {"name": "红糖糯米小丸子", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/91tDmq4zciQ"]], "videoText": ""}, {"name": "橄榄油柠檬腌苹果", "cat": "甜品&烘培🍰", "group": "", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/Y4iFQpn892"]], "videoText": ""}, {"name": "Universal Fruit Gelato Base", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "1. Fruit\n• Fruit / fruit purée: 180–220 g\n一般直接从 200 g 开始最好记。\n\n2. Pick a Liquid Base\nCreamy Dairy Fruit\n• Whole milk: 120–150 g\n• Heavy cream: 40–60 g\nLight Dairy Fruit\n• Whole milk: 160–200 g\n• Heavy cream: 20–30 g\nCoconut Fruit\n• Full-fat canned coconut milk: 120–150 g\n• Whole milk: 50–80 g\n\ne.g. mango sticky rice：\n200 g mango + 140 g coconut milk + 60 g whole milk\n\n3. Sugar\n根据水果甜度：\n• Very sweet fruit: 25–30 g\n• Normal ripe fruit: 30–40 g\n• Tart fruit: 40–50 g\n\n4. Stabilizer\n• Xanthan gum: 约 1/8 tsp 起步\n• 最多大概 1/4 tsp\n水果本身已经有果胶和纤维，所以通常不用像低脂 tea base 放那么多。\n\n5. Salt\n普通水果：\n• 约 0.3–0.5 g\nCoconut / mango sticky rice style：\n• 约 0.7–0.8 g\n\nProcess\nBlend everything → freeze flat 24 h → LIGHT ICE CREAM\n如果偏粉：\n10–15 g milk / coconut milk → RE-SPIN", "links": [], "videoText": ""}, {"name": "Mango Sticky Rice Gelato", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "• Ripe mango: 200 g\n• Full-fat canned coconut milk: 140 g\n• Whole milk: 60 g\n• Cane sugar: 30–35 g\n• Xanthan gum: 约 1/8 tsp 起步，最多接近 1/4 tsp\n• Salt: 0.7–0.8 g\n• Vanilla extract: 可选，约 1 g\n\n处理：\nBlend → freeze flat 24 h → LIGHT ICE CREAM → 如果粉，加入 10–15 g coconut milk → RE-SPIN。", "links": [], "videoText": ""}, {"name": "Jasmine Tea Ice Cream", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "• Whole milk: 280 g\n• Heavy cream: 50 g\n• Jasmine tea: 6–10 g\n• Cane sugar: 35 g\n• Xanthan gum: 约 0.5–0.7 g，实际用量建议控制在约 1/8–1/4 tsp\n• Salt: 0.5 g\n\n处理：\n泡茶/混合 → blend/whisk → freeze flat 24 h → LIGHT ICE CREAM → 如果粉，加入 10–15 g milk/cream → RE-SPIN。", "links": [], "videoText": ""}, {"name": "Coconut Gelato", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "• Coconut water: 200 g\n• Full-fat canned coconut milk: 250 g\n• Cane sugar: 40–45 g\n• Xanthan gum: 约 1/8 tsp\n• Salt: 0.6–0.8 g\n\nProcess:\nBlend → 倒到 MAX FILL 以下 → freeze flat 24 h → LIGHT ICE CREAM → 如果粉，加入 10–15 g coconut milk → RE-SPIN", "links": [], "videoText": ""}, {"name": "黄油桃茉莉 Sorbet", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "• 黄油桃果肉：200 g\n• 茉莉花茶：105 g\n• 蜂蜜：30 g\n• 黄原胶：0.4 g（我其实不太建议放到 0.5 g，200 g 桃这个量 0.3–0.4 已经够了）\n• 可选：柠檬汁 0–3 g，先别加，只有桃子吃起来很甜很平的时候再加\n\n操作跟你看到的配方一样：桃子 + 茉莉茶 + 蜂蜜 + gum 打匀 → 冻 24h → 室温放 5–10 min → Lite Ice Cream。\n\n根据茉莉花浓度可以决定要不要再加然后respin", "links": [], "videoText": ""}, {"name": "Honey Yuzu Ice Cream", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "• Whole milk: 260 g (需要调整配方目前奶味太重了）\n• Coconut beverage: 90 g\n• Honey yuzu tea / 蜂蜜柚子茶: 90 g\n• 另外留作 MIX-IN 的柚子茶果皮/果肉: 10 g\n• Cane sugar: 不额外加\n• Xanthan gum: 0.15–0.2 g\n• Salt: 约 0.3 g\n• Lemon juice: 3–5 g，可选\n\nProcess:\nBlend base → freeze flat 24 h → LIGHT ICE CREAM → 加 10 g 柚子茶果皮/果肉 → MIX-IN。", "links": [], "videoText": ""}, {"name": "Santa Claus Melon Sorbet", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "• Santa Claus melon: 300 g\n• Water: 70 g\n• Xanthan gum: 0.1 g\n• Salt: 约 0.3 g\n• Lemon/lime juice: 5–8 g，可选\n\nProcess:\nBlend → freeze flat 24 h → SORBET → 粉，加40g茉莉花茶 RE-SPIN。", "links": [], "videoText": ""}, {"name": "Kiwi Sorbet", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "• Kiwi：600 g\n• Water：120 g\n• Sugar：40 g\n• Lemon juice：5 g\n• Xanthan gum：0.8 g\n• Salt：0.8 g\nsorbet模式", "links": [], "videoText": ""}, {"name": "养乐多冰激凌", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "Yakult：400 g（5 瓶）\nHeavy cream（淡奶油）：80 g\n牛奶：160 g\n柠檬汁：5 g\n黄原胶（xanthan gum）：1 g", "links": [], "videoText": ""}, {"name": "茉莉青提冰淇淋", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "• 青提 300g\n• 茉莉花茶（普通茶汤）150g\n• 牛奶 100g\n• Heavy cream 100g\n• 蔗糖 20g\n• 黄原胶 1.2–1.4g", "links": [], "videoText": ""}, {"name": "陈皮普洱李子sorbet", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "李子肉削皮 放到容器里，茶覆盖住李子，20g糖，1g黄原胶", "links": [], "videoText": ""}, {"name": "White Peach Sorbet", "cat": "冰激凌🍦", "group": "", "todo": false, "recipe": "- Peach：600 g\n- Water：120 g\n- Sugar：40 g\n- Lemon juice：5 g\n- Xanthan gum：0.8 g\n- Salt：0.8 g\n\nsorbet模式", "links": [], "videoText": ""}, {"name": "蔓越莓果浆", "cat": "饮品🥤", "group": "", "todo": false, "recipe": "材料\n1.3/4 杯新鲜或冷冻后室温解冻的蔓越莓\n2. 一杯椰子水（我用家里本来就有的罐装椰水，含\n3g added sugar)\n3.一根熟透的香蕉，去皮，切成块，冷冻（越熟越甜）\n飞\n\n做法\n1.蔓越莓＋椰子水先丢进搅拌器打到顺滑\n2.加入冻香蕉再打一下下（点动操作，短促地按一下开关，松开，再按一下，重复）\n\n其他：\n-可把椰子水换成橙汁/凤梨汁/椰奶/杏仁奶/豆奶\n-可把香蕉换成冻芒果或冻凤梨\n-不建议用蔓越莓干", "links": [["小红书", "http://xhslink.com/o/1GyEL6F3rJQ"]], "videoText": ""}, {"name": "石榴茉莉冰茶", "cat": "饮品🥤", "group": "", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/62zLbOVLUg2"]], "videoText": ""}, {"name": "青提番石榴茶", "cat": "饮品🥤", "group": "", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/4gqQ3SoFoHm"]], "videoText": ""}, {"name": "苹果气泡水", "cat": "饮品🥤", "group": "", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/85SGa8tbNpJ"]], "videoText": ""}, {"name": "贵州冰浆", "cat": "饮品🥤", "group": "", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/8anzf8iTYLf"]], "videoText": ""}, {"name": "苹果冰奶", "cat": "饮品🥤", "group": "", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/7ZJ7mwPbXqK"]], "videoText": ""}, {"name": "马来西亚苹果汁", "cat": "饮品🥤", "group": "", "todo": false, "recipe": "", "links": [["视频", "https://xhslink.cn/o/22jsYQP3uTr"]], "videoText": ""}, {"name": "玉米汁", "cat": "豆浆机🥛", "group": "", "todo": false, "recipe": "关于糖：根据口感可以加冰糖/白糖会更好喝，但水果玉米本身就很甜了\n米糊口感的玉米汁：玉米150g 大米20g小米20g清水750ml\n只有水的玉米汁：玉米+水，水比玉米高3厘米就好", "links": [], "videoText": ""}, {"name": "红豆浆", "cat": "豆浆机🥛", "group": "", "todo": false, "recipe": "红豆沙牛乳：红豆30g糯米20g红枣5个，冰糖适量，清水500ml，牛奶200ml", "links": [], "videoText": ""}, {"name": "黑米红豆浆", "cat": "豆浆机🥛", "group": "", "todo": false, "recipe": "- 50g红豆50g黑米 800ml水 maybe + 红枣\n- 红豆小米黑米20g20g20g 500ml水", "links": [], "videoText": ""}, {"name": "三色豆浆", "cat": "豆浆机🥛", "group": "", "todo": false, "recipe": "- 黑豆30g红豆15g绿豆15g 水600ml", "links": [], "videoText": ""}, {"name": "代餐奶昔", "cat": "豆浆机🥛", "group": "", "todo": false, "recipe": "- General Recipe: base - 牛奶 or 燕麦奶+水果 frozen的香蕉 or berries然后 + 羽衣甘蓝or胡萝卜+蛋白粉+燕麦+奇亚籽\n- berries and greens: 燕麦奶 + 蛋白粉 + 菠菜 + 羽衣甘蓝 + berries mix\n- mixd greens: 菠菜+生菜+胡萝卜+圣女果+kale", "links": [], "videoText": ""}, {"name": "水果奶昔", "cat": "豆浆机🥛", "group": "", "todo": false, "recipe": "- 水果 + 牛奶/水\n- 青提果蔬汁：青提+生菜+羽衣甘蓝+黄瓜+水\n- 芒果牛油果：mango chuck + avocado + 香蕉+ milk\n- 菠萝牛油果：菠萝 + 牛油果 + 奶", "links": [], "videoText": ""}, {"name": "豆浆", "cat": "豆浆机🥛", "group": "", "todo": false, "recipe": "40g黄豆20g大米10g小米", "links": [], "videoText": ""}, {"name": "Fresh Orange Sauce", "cat": "酱汁🍊", "group": "", "todo": false, "recipe": "橙汁 (1 杯), 白葡萄酒 (1/4 杯), 蜂蜜 (1-2 汤匙), 柠檬 (汁和皮屑), 冷黄油 (1 汤匙)\n\n玉米淀粉 (Cornstarch): 约 1-2 茶匙 (Tea Spoon)\n\n冷水: 1 汤匙 (Table Spoon)，用于混合淀粉\n\n准备水淀粉： 在一个小碗里，将 1-2 茶匙的玉米淀粉和 1 汤匙的冷水彻底搅拌均匀，备用。准备“基底”： 在小平底锅中，倒入白葡萄酒。用中火加热，让它快速煮沸 1-2 分钟，让酒精味挥发掉。（这一步我们不需要浓缩它，只是去酒精味）。加入液体： 调至中火，倒入橙汁和蜂蜜。搅拌均匀，让它煮到**微沸（Simmer）**状态。\n• （观察：此时酱汁的颜色还是鲜艳的橙黄色）增稠（关键一步）：\n• 保持酱汁微沸，开始慢慢地、一点一点地倒入你准备好的水淀粉，同时用另一只手快速搅拌酱汁。\n• 不要一次全倒完！ 淀粉遇热会立刻生效。你可能只需要倒一半就能达到“挂勺”的效果。\n• 一旦达到你想要的浓稠度，立刻进行下一步。关火并收尾 (Finish)：\n• 立刻关火（非常重要，停止加热，停止焦糖化）。\n• 加入柠檬汁（提亮酸度）、柠檬皮屑（增加香气）。\n• 加入那块冷黄油，利用余温快速搅拌，使其乳化。", "links": [], "videoText": ""}]}</script>

  'use strict';
  const data = JSON.parse(document.getElementById('menu-data').textContent);
  const dishes = data.dishes;
  const byName = new Map(dishes.map(d => [d.name, d]));
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  // 点单保存在浏览器本地；隐私模式等无法保存时照常使用
  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 忽略 */ } },
  };
  const CART_KEY = 'bistro-cart', NOTE_KEY = 'bistro-note';
  const cart = store.get(CART_KEY, {});
  for (const name of Object.keys(cart)) {
    if (!byName.has(name) || !(cart[name] > 0)) delete cart[name];  // 菜单更新后去掉已删除的菜
  }
  const state = { cat: 'all', q: '', video: false, recipe: false };

  // --- 分类标签 ---
  const chips = $('chips'), menuEl = $('menu'), toolbar = document.querySelector('.toolbar');
  // 左侧分类栏吸顶在搜索栏下面，需要知道搜索栏的高度
  const setToolbarHeight = () => document.documentElement.style.setProperty('--toolbar-h', toolbar.offsetHeight + 'px');
  setToolbarHeight();
  if (window.ResizeObserver) new ResizeObserver(setToolbarHeight).observe(toolbar);
  const addChip = (key, label, count) => {
    const b = el('button', 'chip');
    b.type = 'button';
    b.dataset.cat = key;
    b.append(el('span', null, label), el('span', 'chip-count', count));
    b.addEventListener('click', () => {
      state.cat = key;
      apply();
      b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      const top = menuEl.getBoundingClientRect().top + scrollY - toolbar.offsetHeight;
      if (scrollY > top) scrollTo({ top, behavior: 'smooth' });
    });
    chips.append(b);
  };
  addChip('all', '全部', dishes.length);
  data.categories.forEach(c => addChip(c.name, c.name, c.count));

  // --- 菜品卡片 ---
  const linkChip = ([label, url]) => {
    const a = el('a', 'link-chip', '▶ ' + label);
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    return a;
  };
  const tagsFor = d => {
    const tags = [];
    if (d.todo) tags.push(el('span', 'tag tag-todo', '还没做'));
    if (d.recipe) tags.push(el('span', 'tag', '📖 有做法'));
    return tags;
  };
  const qtySlot = (name, cls) => {
    const slot = el('div', cls || 'qty-slot');
    slot.dataset.qty = name;
    renderQty(slot);
    return slot;
  };
  function renderQty(slot) {
    const name = slot.dataset.qty, n = cart[name] || 0;
    const button = (cls, text, role, label, delta) => {
      const b = el('button', cls, text);
      b.type = 'button';
      b.dataset.role = role;
      b.setAttribute('aria-label', label + name);
      b.addEventListener('click', e => { e.stopPropagation(); change(name, delta); });
      return b;
    };
    slot.replaceChildren();
    if (!name) return;
    if (!n) {
      slot.append(button('add-btn', slot.classList.contains('big') ? '+ 加入点单' : '+', 'add', '加入点单：', 1));
    } else {
      slot.append(button('step', '−', 'minus', '减少一份：', -1), el('span', 'qty-n', n), button('step', '+', 'plus', '再加一份：', 1));
    }
  }

  const sections = new Map();
  data.categories.forEach(c => {
    const sec = el('section', 'cat');
    const count = el('span', 'cat-count');
    const title = el('h2', 'cat-title');
    title.append(el('span', null, c.name), count);
    const grid = el('div', 'grid');
    sec.append(title, grid);
    menuEl.append(sec);
    sections.set(c.name, { sec, grid, count, visible: 0 });
  });
  dishes.forEach(d => {
    d.search = (d.name + ' ' + d.cat + ' ' + d.recipe).toLowerCase();
    const card = el('article', 'card');
    const main = el('button', 'card-main');
    main.type = 'button';
    main.append(el('span', 'dish-name', d.name));
    const tags = tagsFor(d);
    if (tags.length) { const t = el('span', 'tags'); t.append(...tags); main.append(t); }
    main.addEventListener('click', () => openDish(d));
    const body = el('div', 'card-body');
    body.append(main);
    if (d.links.length) { const links = el('div', 'links'); links.append(...d.links.map(linkChip)); body.append(links); }
    card.append(body, qtySlot(d.name));
    d.card = card;
    sections.get(d.cat).grid.append(card);
  });

  // --- 筛选：分类、搜索、只看有视频/做法 ---
  function apply() {
    const q = state.q.trim().toLowerCase();
    let total = 0, matched = 0;
    const catCounts = new Map();  // 分类标签上的数字：符合搜索和视频/做法筛选的菜数
    sections.forEach(s => { s.visible = 0; });
    dishes.forEach(d => {
      const match = (!q || d.search.includes(q)) && (!state.video || d.links.length > 0) && (!state.recipe || !!d.recipe);
      d.match = match;
      if (match) { catCounts.set(d.cat, (catCounts.get(d.cat) || 0) + 1); matched++; }
      d.visible = match && (state.cat === 'all' || d.cat === state.cat);
      d.card.hidden = !d.visible;
      if (d.visible) { sections.get(d.cat).visible++; total++; }
    });
    sections.forEach(s => { s.sec.hidden = !s.visible; s.count.textContent = s.visible + ' 道'; });
    $('empty').hidden = total > 0;
    chips.querySelectorAll('.chip').forEach(c => {
      const n = c.dataset.cat === 'all' ? matched : (catCounts.get(c.dataset.cat) || 0);
      c.querySelector('.chip-count').textContent = n;
      c.classList.toggle('chip-empty', n === 0);
      c.setAttribute('aria-pressed', String(c.dataset.cat === state.cat));
    });
  }
  $('search').addEventListener('input', e => { state.q = e.target.value; apply(); });
  document.querySelectorAll('.toggle').forEach(b => b.addEventListener('click', () => {
    state[b.dataset.filter] = !state[b.dataset.filter];
    b.setAttribute('aria-pressed', String(state[b.dataset.filter]));
    apply();
  }));

  // --- 菜品详情 ---
  const dishDialog = $('dish-dialog');
  function openDish(d) {
    $('dish-cat').textContent = d.cat;
    $('dish-name').textContent = d.name;
    $('dish-tags').replaceChildren(...tagsFor(d).filter(t => t.classList.contains('tag-todo')));
    $('dish-links').replaceChildren(...d.links.map(linkChip));
    $('dish-links').hidden = !d.links.length;
    const recipe = $('dish-recipe');
    recipe.textContent = d.recipe || d.videoText || '还没有记录做法';
    recipe.classList.toggle('muted', !d.recipe && !d.videoText);
    recipe.hidden = !data.showRecipes && !d.videoText;
    $('dish-qty').dataset.qty = d.name;
    renderQty($('dish-qty'));
    if (!dishDialog.open) dishDialog.showModal();
    dishDialog.querySelector('.sheet-body').scrollTop = 0;
  }

  // --- 随机配菜：选好荤菜/素菜/主食各几道，随机配一桌（不重复） ---
  const MEAL_KEY = 'bistro-meal';
  const mealDialog = $('meal-dialog'), groups = data.mealGroups;
  const mealCounts = store.get(MEAL_KEY, {});
  groups.forEach(g => { if (!(mealCounts[g.name] >= 0)) mealCounts[g.name] = g.default; });
  let meal = [];  // [{group, dish}]
  const poolFor = group => dishes.filter(d => d.group === group && d.match);  // 也遵守搜索和视频/做法筛选
  const pick = (pool, used) => {
    const choices = pool.filter(d => !used.has(d.name));
    return choices.length ? choices[Math.floor(Math.random() * choices.length)] : null;
  };
  function renderMealCounts() {
    const focused = document.activeElement && document.activeElement.getAttribute('aria-label');
    $('meal-counts').replaceChildren(...groups.map(g => {
      const n = mealCounts[g.name], available = poolFor(g.name).length;
      const step = (text, delta, disabled, label) => {
        const b = el('button', 'step', text);
        b.type = 'button';
        b.disabled = disabled;
        b.setAttribute('aria-label', label + g.name);
        b.addEventListener('click', () => { mealCounts[g.name] = n + delta; store.set(MEAL_KEY, mealCounts); renderMealCounts(); });
        return b;
      };
      const label = el('div', 'meal-count-label', g.name);
      label.append(el('span', 'cart-item-cat', '可选 ' + available + ' 道'));
      const stepper = el('div', 'qty-slot');
      stepper.append(step('−', -1, n <= 0, '少一道'), el('span', 'qty-n', n), step('+', 1, n >= Math.min(available, 9), '多一道'));
      const row = el('div', 'meal-count');
      row.append(label, stepper);
      return row;
    }));
    const filters = [state.video && '有视频', state.recipe && '有做法', state.q.trim() && '搜索“' + state.q.trim() + '”'].filter(Boolean);
    $('meal-hint').textContent = filters.length ? '只从符合筛选的菜里选：' + filters.join('、') : '选好每类几道，帮你随机配一桌';
    $('meal-roll').disabled = !groups.some(g => mealCounts[g.name] > 0);
    const again = focused && $('meal-counts').querySelector('[aria-label="' + CSS.escape(focused) + '"]');
    if (again) (again.disabled ? again.parentNode.querySelector('button:not(:disabled)') || $('meal-roll') : again).focus();
  }
  function renderMeal() {
    $('meal-result').replaceChildren(...meal.map((m, i) => {
      const name = el('button', 'meal-name', m.dish.name);
      name.type = 'button';
      name.addEventListener('click', () => openDish(m.dish));
      const top = el('div', 'meal-top');
      top.append(el('span', 'tag', m.group), name);
      const info = el('div', 'meal-item');
      info.append(top);
      if (m.dish.links.length) { const links = el('div', 'links'); links.append(...m.dish.links.map(linkChip)); info.append(links); }
      const swap = el('button', 'icon-btn', '🔄');
      swap.type = 'button';
      swap.setAttribute('aria-label', '换一道' + m.group + '：' + m.dish.name);
      swap.addEventListener('click', () => swapMeal(i));
      const li = el('li');
      li.append(info, swap, qtySlot(m.dish.name));
      return li;
    }));
    $('meal-add').hidden = !meal.length;
    $('meal-roll').textContent = meal.length ? '🎲 重新生成' : '🎲 生成';
  }
  function rollMeal() {
    const used = new Set();
    let short = false;
    meal = [];
    groups.forEach(g => {
      const pool = poolFor(g.name);
      for (let i = 0; i < mealCounts[g.name]; i++) {
        const d = pick(pool, used);
        if (!d) { short = true; break; }
        used.add(d.name);
        meal.push({ group: g.name, dish: d });
      }
    });
    renderMeal();
    if (short) toast('符合条件的菜不够，已经尽量选了');
  }
  function swapMeal(i) {
    const d = pick(poolFor(meal[i].group), new Set(meal.map(m => m.dish.name)));
    if (!d) { toast('这一类没有别的菜可以换了'); return; }
    meal[i] = { group: meal[i].group, dish: d };
    renderMeal();
    $('meal-result').children[i].querySelector('.icon-btn').focus();
  }
  $('random').addEventListener('click', () => { renderMealCounts(); renderMeal(); mealDialog.showModal(); });
  $('meal-roll').addEventListener('click', rollMeal);
  $('meal-add').addEventListener('click', () => {
    let added = 0;
    meal.forEach(m => { if (!cart[m.dish.name]) { cart[m.dish.name] = 1; added++; } });
    store.set(CART_KEY, cart);
    refreshCart();
    toast(added ? '已加入 ' + added + ' 道菜' : '这些菜都已经在点单里了');
  });

  // --- 点单 ---
  const cartDialog = $('cart-dialog'), noteEl = $('cart-note');
  noteEl.value = store.get(NOTE_KEY, '');
  noteEl.addEventListener('input', () => store.set(NOTE_KEY, noteEl.value));
  function change(name, delta) {
    const before = cart[name] || 0, after = Math.max(0, before + delta);
    if (after) cart[name] = after; else delete cart[name];
    store.set(CART_KEY, cart);
    refreshCart();
    if (!before && after) toast('已加入：' + name);
  }
  function refreshCart() {
    // 重新渲染后把焦点放回同一个菜的按钮上，方便键盘操作
    const active = document.activeElement;
    const slot = active && active.closest ? active.closest('[data-qty]') : null;
    const scope = slot ? (slot.id ? slot : slot.closest('[id]')) : null;
    const focus = slot && { name: slot.dataset.qty, role: active.dataset.role, scopeId: scope && scope.id };

    const names = Object.keys(cart);
    const list = $('cart-list');
    list.replaceChildren(...names.map(name => {
      const li = el('li'), label = el('div', 'cart-item-name', name);
      label.append(el('span', 'cart-item-cat', byName.get(name).cat));
      li.append(label, qtySlot(name));
      return li;
    }));
    document.querySelectorAll('[data-qty]').forEach(renderQty);
    const portions = names.reduce((sum, n) => sum + cart[n], 0);
    $('cartbar').hidden = !names.length;
    $('cart-badge').textContent = portions;
    $('cart-summary').textContent = '已点 ' + names.length + ' 道菜';
    $('cart-empty').hidden = names.length > 0;
    ['clear-cart', 'copy-cart', 'share-cart'].forEach(id => { $(id).disabled = !names.length; });

    if (focus && focus.scopeId) {
      const root = $(focus.scopeId);
      const target = root.matches('[data-qty]') ? root : root.querySelector('[data-qty="' + CSS.escape(focus.name) + '"]');
      const button = target && (target.querySelector('[data-role="' + focus.role + '"]') || target.querySelector('button'));
      if (button) button.focus();
    }
  }
  const orderText = () => {
    const names = Object.keys(cart);
    const lines = names.map((n, i) => (i + 1) + '. ' + n + (cart[n] > 1 ? ' ×' + cart[n] : ''));
    const note = noteEl.value.trim();
    return data.title + ' 点单（' + names.length + ' 道菜）\n' + lines.join('\n') + (note ? '\n备注：' + note : '');
  };
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 退回旧方法 */ }
    const ta = el('textarea');
    ta.value = text;
    cartDialog.append(ta);  // 放在对话框里，避免被模态对话框挡住
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { /* 忽略 */ }
    ta.remove();
    return ok;
  }
  $('open-cart').addEventListener('click', () => cartDialog.showModal());
  $('copy-cart').addEventListener('click', async () => {
    toast(await copyText(orderText()) ? '已复制，发给大厨吧 👨‍🍳' : '复制失败，请手动截图');
  });
  if (navigator.share) {
    $('share-cart').hidden = false;
    $('share-cart').addEventListener('click', () => navigator.share({ title: data.title, text: orderText() }).catch(() => {}));
  }
  $('clear-cart').addEventListener('click', () => {
    if (!confirm('确定清空点单吗？')) return;
    for (const name of Object.keys(cart)) delete cart[name];
    store.set(CART_KEY, cart);
    refreshCart();
  });

  // --- 对话框：点背景或✕关闭 ---
  document.querySelectorAll('dialog').forEach(dialog => {
    dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
    dialog.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => dialog.close()));
  });
  dishDialog.addEventListener('close', () => { $('dish-qty').dataset.qty = ''; renderQty($('dish-qty')); });

  let toastTimer;
  function toast(message) {
    const t = $('toast');
    // 有对话框打开时，把提示放进对话框，才能显示在最上层
    const host = [...document.querySelectorAll('dialog[open]')].pop() || document.body;
    if (t.parentNode !== host) host.append(t);
    t.textContent = message;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  apply();
  refreshCart();
})();
</script>
</body>
</html>
